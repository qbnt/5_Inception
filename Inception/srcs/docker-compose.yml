version: '3'

services:
  mariadb:
    container_name: mariadb
    networks:
      - LeNetwork
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb
    env_file: .env
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: on-failure
    expose:
      - "3306"

  wordpress:
    container_name: wordpress
    networks:
      - LeNetwork
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress
    env_file: .env
    volumes:
      - wordpress_data:/var/www/wordpress
    depends_on:
      - mariadb
    restart: on-failure
    expose:
      - "9000"

  nginx:
    container_name: nginx
    networks:
      - LeNetwork
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: nginx
    env_file: .env
    volumes:
      - wordpress_data:/var/www/wordpress
    depends_on:
      - wordpress
    ports:
      - "443:443"
    restart: on-failure

networks:
  LeNetwork:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: 'none'
      device: '/home/parallels/data/mariadb'
      o: 'bind'
  wordpress_data:
    driver: local
    driver_opts:
      type: 'none'
      device: '/home/parallels/data/wordpress'
      o: 'bind'